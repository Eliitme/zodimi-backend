[project]
name = "zodimi-backend"
version = "0.1.0"
description = "Zodimi — astrology & tarot backend (FastAPI + Supabase)"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "supabase>=2.6",
    "pydantic-settings>=2.3",
    "pyjwt[crypto]>=2.8",
    "kerykeion>=5.12.9,<6",
    "geopy>=2.5.0",
    "timezonefinder>=8.2.5",
    "google-genai>=2.17.0",
    "httpx>=0.28.1",
    "aioapns>=4.0",
    "openai>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pragmatic set: real bugs + import hygiene, not formatting opinions
# (the project prioritises readability over strict style enforcement).
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = [
    "E402",  # sys.path setup before imports in scripts
    "B008",  # FastAPI Depends() in defaults is the framework idiom
    # HTTPException raised inside except blocks is a deliberate translation
    # of an internal error into a user-facing one; chaining the original
    # adds nothing for the client and risks leaking internals in tracebacks.
    "B904",
]
