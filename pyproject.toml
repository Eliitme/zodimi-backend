[project]
name = "stellune-backend"
version = "0.1.0"
description = "Stellune — astrology & tarot backend (FastAPI + Supabase)"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "supabase>=2.6",
    "pydantic-settings>=2.3",
    "pyjwt[crypto]>=2.8",
    "kerykeion>=5.12.9,<6",
    "geopy>=2.5.0",
    "timezonefinder>=8.2.5",
    "google-genai>=2.17.0",
    "httpx>=0.28.1",
    "aioapns>=4.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
