services:
  api:
    build: .
    # Loopback only: Caddy is the sole way in (deploy/Caddyfile.example).
    # Published on 0.0.0.0 the API is reachable without TLS and with a fully
    # attacker-controlled X-Forwarded-For, which would undo the per-IP rate
    # limit no matter how carefully the header is parsed.
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    # Local Supabase stack runs on the HOST (`supabase start`), so inside the
    # container its 127.0.0.1 URL must be rewritten — otherwise JWKS fetch
    # fails and every authenticated route returns 401.
    environment:
      SUPABASE_URL: http://host.docker.internal:54321
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Natal report queue consumer. Cron jobs (pregen, watchdog) run via
  # `docker compose exec api python -m app.jobs.<job>` from the host crontab.
  report-worker:
    build: .
    command: ["python", "-m", "app.jobs.natal_report_worker", "--loop"]
    env_file:
      - .env
    environment:
      SUPABASE_URL: http://host.docker.internal:54321
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
