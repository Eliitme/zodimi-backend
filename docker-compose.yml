services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    # Local Supabase stack runs on the HOST (`supabase start`), so inside the
    # container its 127.0.0.1 URL must be rewritten — otherwise JWKS fetch
    # fails and every authenticated route returns 401.
    environment:
      SUPABASE_URL: http://host.docker.internal:54321
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
